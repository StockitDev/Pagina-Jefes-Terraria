<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#cdddc8">
  <meta name="description" content="Browse Terraria bosses and their stats.">
  <title>Terraria Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="#" aria-label="Terraria Library, home">
      <img class="wordmark-icon" src="img/terraria.png" alt="">
      <span>Terraria <span class="wordmark-divider">/</span> Library</span>
    </a>
    <a class="header-link" href="about.html">About this project</a>
  </header>

  <main class="page">
    <section class="intro">
      <p class="eyebrow">The Terraria Bestiary</p>
      <h1>Terraria Library</h1>
      <p class="intro-copy">Browse bosses and their stats.</p>
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <span class="visually-hidden">Search bosses</span>
        <input id="search" type="search" placeholder="Type a name..." autocomplete="off">
        <kbd>/</kbd>
      </label>
    </section>

    <section class="workspace" aria-label="Boss guide">
      <aside class="boss-panel">
        <div class="list-heading">
          <h2>Bosses</h2>
          <span id="result-count"></span>
        </div>
        <div id="boss-list" class="boss-list" role="listbox" aria-label="Boss list"></div>
      </aside>
      <article id="detail" class="detail" aria-live="polite"></article>
    </section>

    <footer><span id="boss-total"></span> bosses · Data from MySQL</footer>
  </main>
</body>
</html>
